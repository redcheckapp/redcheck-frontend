<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/redcheck.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RedCheck</title>

    <!-- PWA: lets users "Add to Home Screen" and launch RedCheck in
         standalone mode (no browser URL bar/chrome) — the only way to
         hide the address bar for users, since a normal browser tab can't
         do this via script for phishing-prevention reasons. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#cc2229" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RedCheck" />

    <!-- ANTI-FLICKER SCRIPT: Applies dark mode synchronously before the browser paints the page -->
    <script>
      try {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#e3e7e2] dark:bg-gray-950 transition-colors duration-500 m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
