name: CI/CD Pipeline

on:
  push:
    branches: ["demo"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Download code
        uses: actions/checkout@v3

      - name: Login into Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Builds and uploads Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/redcheck-frontend:latest
          # Variable injection for Vite pointing to the API
          build-args: |
            VITE_API_URL=https://redcheck.es

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connects via SSH and Deploys
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd redcheck-app
            sudo docker compose pull frontend
            sudo docker compose up -d frontend
